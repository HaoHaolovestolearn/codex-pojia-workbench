name: Test and Release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q workbench.py package_release.py
      - run: python workbench.py --version
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Start local workbench and test browser UI
        run: |
          python workbench.py --no-browser &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python -c "import time,urllib.request; [(time.sleep(.1)) for _ in range(10)]; urllib.request.urlopen('http://127.0.0.1:8765').read()"
          npm run test:ui
      - uses: actions/upload-artifact@v6
        with:
          name: browser-screenshots
          path: dist/ui/
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
    needs: [test, browser]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install "pyinstaller>=6.10,<7"
      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm --clean --onefile --name Codex-Pojia-Workbench --add-data "web:web" --add-data "catalog.json:." workbench.py
      - name: Check executable startup and resources
        run: python scripts/exe_smoke.py dist/Codex-Pojia-Workbench.exe
      - name: Package source and checksums
        run: python package_release.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --verify-tag --title "Codex Pojia Workbench $env:RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { throw 'Could not create release.' }
          }
          gh release upload $env:RELEASE_TAG dist/Codex-Pojia-Workbench-Windows-x64.exe dist/Codex-Pojia-Workbench-Source.zip dist/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload release assets.' }
